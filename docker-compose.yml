services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bank-marketing-api
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bank-marketing-frontend
    ports:
      - "3000:3000"
    depends_on:
      - api